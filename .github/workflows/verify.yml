name: Verify Kahiye
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: kahiye_security_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
      TEST_DATABASE_URL: postgres://postgres:disposable-test-only@localhost:5432/kahiye_security_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:security:bootstrap
      - run: npm run test:providers
      - run: npx tsx --conditions=react-server scripts/test-family-plan-routes.mjs
      - run: npx tsx scripts/verify-handbook-render.tsx
      - run: npm run build
      - run: node scripts/verify-seo-build.mjs
